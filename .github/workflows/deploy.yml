name: Deploy to Cloudflare

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Wrangler 3.90.0 (Nov 2024) predated _redirects support for Workers
      # Static Assets, which shipped 2025-04-08. Under 3.90.0 the file was
      # stripped from the upload and never applied, so all 116 rules in
      # public/_redirects returned 404 at the edge for months.
      # Fixed 2026-09-12 by moving to 4.x and CONFIRMED live: 7 of 7 probed
      # URLs now 301 correctly. DO NOT pin back below 4.x.
      - name: Deploy
        run: npx wrangler@4.128.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Purge cache
        if: success()
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' || true

      # RATCHETED 2026-09-12 from warn-only to hard failure, after a deploy
      # proved all of these return 301. The redirect layer sat silently dead
      # for months because nothing asserted it; this is that assertion.
      # Each entry is "<source> <expected-destination-path>".
      - name: Verify redirects are live
        if: success()
        run: |
          sleep 20
          fail=0
          while read -r src want; do
            [ -z "$src" ] && continue
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://www.cubicalgolfer.com$src")
            dest=$(curl -s -o /dev/null -w '%{redirect_url}' "https://www.cubicalgolfer.com$src")
            if [ "$code" = "301" ] && [ "${dest%$want}" != "$dest" ]; then
              echo "ok    $src -> $want"
            else
              echo "FAIL  $src -> got $code ${dest:-<none>} (expected 301 to $want)"
              fail=1
            fi
          done <<'PROBES'
          /office-hacks/ /improve-your-golf-game/
          /privacy/ /privacy-policy/
          /best-golf-apps-2026/ /best-golf-apps/
          /best-golf-swing-analyzers-iphone/ /best-golf-swing-analyzers/
          /arccos-caddie-review-2026/ /arccos-caddie-review/
          /golf-mental-game-tips/ /how-to-break-90/
          /indoor-golf/ /best-indoor-putting-green-office-home/
          /best-blade-putters-2026/ /best-golf-putters-2026/
          PROBES
          if [ "$fail" != "0" ]; then
            echo "::error::public/_redirects is not being applied. Check the wrangler version in this file."
            exit 1
          fi
          echo "All redirect probes passed."
